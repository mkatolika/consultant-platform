name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  CANDIDATE_IMAGE: consultant-services-frontend
  CANDIDATE_ARTIFACT: frontend-candidate-image
  DEPENDENCIES_ARTIFACT: frontend-node-modules

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Package restored dependencies
        run: tar -czf node-modules.tar.gz node_modules package-lock.json

      - name: Upload restored dependencies
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEPENDENCIES_ARTIFACT }}
          path: node-modules.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-candidate:
    name: Build candidate once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build immutable candidate
        env:
          NPM_STRICT_SSL: ${{ vars.NPM_STRICT_SSL || 'true' }}
        run: |
          docker build \
            --build-arg NPM_STRICT_SSL="$NPM_STRICT_SSL" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$CANDIDATE_IMAGE:$GITHUB_SHA" \
            .

      - name: Save candidate without rebuilding
        run: docker save "$CANDIDATE_IMAGE:$GITHUB_SHA" | gzip > candidate-image.tar.gz

      - name: Create build metadata
        run: |
          {
            echo "IMAGE_NAME=$CANDIDATE_IMAGE"
            echo "CANDIDATE_TAG=$CANDIDATE_IMAGE:$GITHUB_SHA"
            echo "GIT_SHA=$GITHUB_SHA"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            VERSION_BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            echo "VERSION_BASE=$VERSION_BASE"
          } > build-metadata.env

      - name: Upload candidate image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: |
            candidate-image.tar.gz
            build-metadata.env
          retention-days: 2
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEPENDENCIES_ARTIFACT }}
      - name: Restore dependency artifact
        run: tar -xzf node-modules.tar.gz
      - name: Run tests with coverage
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --coverage --coverageReporters=text --coverageReporters=json-summary
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: Lint and static quality
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEPENDENCIES_ARTIFACT }}
      - name: Restore dependency artifact
        run: tar -xzf node-modules.tar.gz
      - name: Run existing ESLint configuration
        run: npx --no-install eslint src --max-warnings=20

  sast:
    name: SAST (CodeQL)
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  secret-detection:
    name: Secret detection (Gitleaks)
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan (Trivy)
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan locked dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  container-scan:
    name: Container scan (Trivy)
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
      - name: Load exact candidate
        run: |
          gunzip -c candidate-image.tar.gz | docker load
          source build-metadata.env
          docker image inspect "$CANDIDATE_TAG" >/dev/null
      - name: Scan exact candidate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CANDIDATE_IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  dast:
    name: DAST (OWASP ZAP baseline)
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
      - name: Load and run exact candidate
        run: |
          gunzip -c candidate-image.tar.gz | docker load
          source build-metadata.env
          docker run --detach --name frontend-candidate --publish 8080:80 "$CANDIDATE_TAG"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs frontend-candidate
          exit 1
      - name: Run ZAP baseline against candidate
        run: |
          docker run --rm \
            --network host \
            --volume "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080 -m 1 -I -r zap-report.html
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-report.html
          retention-days: 7
          if-no-files-found: warn
      - name: Stop candidate
        if: always()
        run: docker rm --force frontend-candidate || true

  version:
    name: Generate immutable version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - unit-tests
      - lint
      - sast
      - secret-detection
      - dependency-scan
      - container-scan
      - dast
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from package baseline and run number
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          VERSION="$MAJOR_MINOR.$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > version.txt
      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: frontend-version
          path: version.txt
          retention-days: 2
          if-no-files-found: error

  promote-and-push:
    name: Promote candidate to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-candidate
      - unit-tests
      - lint
      - sast
      - secret-detection
      - dependency-scan
      - container-scan
      - dast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
      - name: Load exact approved candidate
        run: |
          gunzip -c candidate-image.tar.gz | docker load
          source build-metadata.env
          docker image inspect "$CANDIDATE_TAG" >/dev/null
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag and push without rebuilding
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'consultant-services-frontend' }}
        run: |
          source build-metadata.env
          VERSION="$VERSION_BASE.$GITHUB_RUN_NUMBER"
          TARGET="docker.io/$DOCKERHUB_USER/$IMAGE_NAME"
          docker tag "$CANDIDATE_TAG" "$TARGET:$VERSION"
          docker tag "$CANDIDATE_TAG" "$TARGET:$GIT_SHA"
          docker tag "$CANDIDATE_TAG" "$TARGET:latest"
          docker push "$TARGET:$VERSION"
          docker push "$TARGET:$GIT_SHA"
          docker push "$TARGET:latest"

  deploy:
    name: Deploy exact version to Azure Container Apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [promote-and-push, version]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      fqdn: ${{ steps.deploy.outputs.fqdn }}
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container App to exact version
        id: deploy
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'consultant-services-frontend' }}
          VERSION: ${{ needs.version.outputs.version }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          IMAGE="docker.io/$DOCKERHUB_USER/$IMAGE_NAME:$VERSION"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none
          FQDN=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Verify Azure deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy, version]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify image and public endpoint
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'consultant-services-frontend' }}
          VERSION: ${{ needs.version.outputs.version }}
          FQDN: ${{ needs.deploy.outputs.fqdn }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          EXPECTED_IMAGE="docker.io/$DOCKERHUB_USER/$IMAGE_NAME:$VERSION"
          ACTUAL_IMAGE=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.template.containers[0].image --output tsv)
          test "$ACTUAL_IMAGE" = "$EXPECTED_IMAGE"
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://$FQDN/" >/dev/null
